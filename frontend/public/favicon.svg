<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="omega" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="55%" stop-color="#5b3df0"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- The rounded tile, matching the brand badge in the header. -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#omega)"/>

  <!-- The Omega glyph. Strokes rather than a filled path so it stays
       crisp when the browser scales it down to 16px in the tab bar. -->
  <g fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round">
    <path d="M23 45a15 15 0 0 1 0-26"/>
    <path d="M41 45a15 15 0 0 0 0-26"/>
  </g>
  <path d="M26 41h12" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
</svg>